# Test Configuration
spring.application.name=demo-test

# H2 Database Configuration for Testing
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# JPA Configuration for Testing
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable MongoDB for testing
spring.data.mongodb.uri=

# Naver Shopping API Configuration (Test values)
naver.shopping.client.id=test-client-id
naver.shopping.client.secret=test-client-secret

# Disable OpenAI for testing
spring.ai.openai.api-key=test-key
